[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyslga"
version = "0.1.0"
description = "Cached SLGA soil-property windows for Australia — download once per chunk, never twice"
readme = "README.md"
authors = [
  { name = "Borevitz Lab, Australian National University" },
  { name = "Yasar Adeel Ansari", email = "u6737670@anu.edu.au" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "slga",
  "soil",
  "australia",
  "tern",
  "agriculture",
  "geospatial",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
# The geospatial stack (rasterio, xarray, zarr, requests) is provided by
# conda via environment.yml; only the lab core is declared here so
# `pip install -e .` is fast and doesn't re-resolve it.
dependencies = [
  "attrs",
  "borevitz-lab",
  "typing_extensions",
]

[project.urls]
Homepage = "https://github.com/thestochasticman/pyslga"
Repository = "https://github.com/thestochasticman/pyslga"
Issues = "https://github.com/thestochasticman/pyslga/issues"

[tool.setuptools.packages.find]
include = ["pyslga", "pyslga.*"]
